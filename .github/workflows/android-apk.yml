name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK (${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'release') }})
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Android Signing Keystore
        id: configure-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MANUAL_BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          # 1. Determine build type (release or debug)
          BUILD_TYPE="release"
          if [ -n "$MANUAL_BUILD_TYPE" ]; then
            BUILD_TYPE="$MANUAL_BUILD_TYPE"
          fi
          echo "TARGET_BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "Build Type selected: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
              echo "✅ Using production keystore provided in GitHub Secrets"
              echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

              node -e '
                const fs = require("fs");
                const creds = {
                  android: {
                    keystore: {
                      keystorePath: "release.keystore",
                      keystorePassword: process.env.KEYSTORE_PASSWORD,
                      keyAlias: process.env.KEY_ALIAS,
                      keyPassword: process.env.KEY_PASSWORD || process.env.KEYSTORE_PASSWORD
                    }
                  }
                };
                fs.writeFileSync("credentials.json", JSON.stringify(creds, null, 2));
              '
            else
              echo "⚠️ Production keystore secrets not detected. Generating standalone CI keystore for signing..."
              keytool -genkeypair -v \
                -keystore release.keystore \
                -alias biztrack-key \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass biztrack123 \
                -keypass biztrack123 \
                -dname "CN=BizTrack, OU=Mobile, O=BizTrack, L=City, S=State, C=US"

              node -e '
                const fs = require("fs");
                const creds = {
                  android: {
                    keystore: {
                      keystorePath: "release.keystore",
                      keystorePassword: "biztrack123",
                      keyAlias: "biztrack-key",
                      keyPassword: "biztrack123"
                    }
                  }
                };
                fs.writeFileSync("credentials.json", JSON.stringify(creds, null, 2));
              '
            fi

            # Copy keystore to android/app and configure gradle properties for multi-strategy compatibility
            cp release.keystore android/app/release.keystore
            cp credentials.json android/credentials.json 2>/dev/null || true
          fi

      - name: 🔨 Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ "$TARGET_BUILD_TYPE" = "debug" ]; then
            echo "🚀 Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "🚀 Building Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: 📦 Prepare APK Artifact
        id: prepare-artifact
        run: |
          mkdir -p output-apk
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          DEST_NAME="BizTrack-${TARGET_BUILD_TYPE}.apk"
          cp "$APK_FILE" "output-apk/$DEST_NAME"
          echo "APK_FILE_PATH=output-apk/$DEST_NAME" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$DEST_NAME" >> $GITHUB_ENV
          echo "Final APK ready: output-apk/$DEST_NAME"

      - name: 📤 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BizTrack-${{ env.TARGET_BUILD_TYPE }}-APK
          path: ${{ env.APK_FILE_PATH }}
          retention-days: 30

      - name: 🚀 Publish APK to GitHub Release (Tag Triggered)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE_PATH }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚨 Display Diagnostics on Failure
        if: failure()
        run: |
          echo "==================== BUILD FAILURE DIAGNOSTICS ===================="
          echo "Tip: Check the Gradle task error details in the build step above."
